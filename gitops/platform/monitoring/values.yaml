# Desired state for cluster-wide monitoring. Synced by root-platform-monitoring
# (Terraform, when enable_monitoring). Same pattern as gitops/platform/external-secrets.

# Grafana admin via ESO. SM JSON keys are admin_user / admin_password (gjson).
# Target Secret keys must match kube-prometheus-stack.grafana.admin.* below.
clusterSecretStoreName: aws-secrets-manager
refreshInterval: 1h
grafanaAdmin:
  secretName: grafana-admin
  remoteKey: bank-of-anthos-grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# Wrapper-level Ingress (not the grafana subchart). Terraform injects host /
# certificateArn / groupName. Empty host = lab, no Ingress.
grafana:
  ingress:
    host: ""
    certificateArn: ""
    groupName: bank-of-anthos
    # helm.releaseName kube-prometheus-stack → Service kube-prometheus-stack-grafana.
    serviceName: kube-prometheus-stack-grafana
    servicePort: 80

kube-prometheus-stack:
  defaultRules:
    rules:
      etcd: false
      kubeControllerManager: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false

  # EKS control plane is not scrapeable as in-cluster pods.
  # coreDns and kubeProxy stay on — they create scrape Services in kube-system
  # (AppProject destination is added by Terraform when enable_monitoring).
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeControllerManager:
    enabled: false

  alertmanager:
    ingress:
      enabled: false
    alertmanagerSpec:
      replicas: 1
      storage: {}

  grafana:
    replicas: 1
    persistence:
      enabled: false
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # Subchart Ingress stays off — we render templates/grafana-ingress.yaml instead.
    ingress:
      enabled: false
      hosts: []
    service:
      type: ClusterIP

  prometheus:
    ingress:
      enabled: false
    prometheusSpec:
      replicas: 1
      retention: 12h
      # emptyDir — no PVC (lab FinOps; data is lost on restart).
      storageSpec:
        emptyDir: {}
