apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  labels:
    app.kubernetes.io/name: platform-monitoring
    app.kubernetes.io/part-of: bank-of-anthos
    app.kubernetes.io/component: grafana
  annotations:
    # Materialize the Secret before Grafana pods start (existingSecret).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.grafanaAdmin.secretName | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.grafanaAdmin.userKey | quote }}
      remoteRef:
        key: {{ .Values.grafanaAdmin.remoteKey | quote }}
        property: admin_user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: {{ .Values.grafanaAdmin.passwordKey | quote }}
      remoteRef:
        key: {{ .Values.grafanaAdmin.remoteKey | quote }}
        property: admin_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
