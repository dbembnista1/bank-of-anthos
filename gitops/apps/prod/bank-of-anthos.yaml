apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bank-of-anthos-prod
  namespace: argocd
spec:
  project: bank-of-anthos
  source:
    repoURL: https://github.com/dbembnista1/aws-eks-bank-of-anthos.git
    path: charts/bank-of-anthos
    targetRevision: main
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: bank-of-anthos-prod
  # Manual sync for prod (demo/lab: promote deliberately from the Argo CD UI/CLI).
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
