# remoteKey for accounts/ledger is injected by Terraform via Argo (RDS-managed secret ARN).
clusterSecretStoreName: aws-secrets-manager
refreshInterval: 1h

jwt:
  secretName: jwt-key
  remoteKey: bank-of-anthos-jwt

accountsDb:
  secretName: accounts-db-credentials
  remoteKey: ""

ledgerDb:
  secretName: ledger-db-credentials
  remoteKey: ""
