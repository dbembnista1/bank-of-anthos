# After terraform apply with prod in enabled_environments:
#   - accountsDb/ledgerDb.remoteKey from rds_master_user_secret_arns.prod.*
clusterSecretStoreName: aws-secrets-manager
refreshInterval: 1h

jwt:
  secretName: jwt-key
  remoteKey: bank-of-anthos-jwt

accountsDb:
  secretName: accounts-db-credentials
  remoteKey: "PLACEHOLDER_PROD_ACCOUNTS_RDS_SECRET_ARN"

ledgerDb:
  secretName: ledger-db-credentials
  remoteKey: "PLACEHOLDER_PROD_LEDGER_RDS_SECRET_ARN"
