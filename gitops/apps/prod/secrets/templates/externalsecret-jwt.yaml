apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt-key
  labels:
    app.kubernetes.io/name: bank-of-anthos
    app.kubernetes.io/component: jwt
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.jwt.secretName | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # SM JSON keys are private_key/public_key (no dots — ESO property is gjson).
    # K8s Secret keys stay jwtRS256.* so the umbrella chart volume mounts stay unchanged.
    - secretKey: jwtRS256.key
      remoteRef:
        key: {{ .Values.jwt.remoteKey | quote }}
        property: private_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: jwtRS256.key.pub
      remoteRef:
        key: {{ .Values.jwt.remoteKey | quote }}
        property: public_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
