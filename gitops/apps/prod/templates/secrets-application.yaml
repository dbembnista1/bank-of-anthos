apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bank-of-anthos-secrets-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: {{ .Values.project }}
  source:
    repoURL: {{ required "repoURL must be set (root App helm parameter from Terraform argocd_repo_url)" .Values.repoURL | quote }}
    path: gitops/apps/prod/secrets
    targetRevision: {{ .Values.targetRevision | quote }}
    helm:
      parameters:
        - name: accountsDb.remoteKey
          value: {{ required "secrets.accountsDb.remoteKey must be set from Terraform" .Values.secrets.accountsDb.remoteKey | quote }}
        - name: ledgerDb.remoteKey
          value: {{ required "secrets.ledgerDb.remoteKey must be set from Terraform" .Values.secrets.ledgerDb.remoteKey | quote }}
        - name: accountsDb.host
          value: {{ required "database.accountsDb.host must be set from Terraform" .Values.database.accountsDb.host | quote }}
  destination:
    server: {{ .Values.destinationServer | quote }}
    namespace: {{ .Values.destinationNamespace | quote }}
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.data[].remoteRef.nullBytePolicy
        - .spec.dataFrom[].extract.conversionStrategy
        - .spec.dataFrom[].extract.decodingStrategy
        - .spec.dataFrom[].extract.metadataPolicy
        - .spec.dataFrom[].extract.nullBytePolicy
        - .spec.target.deletionPolicy
        - .spec.target.template.mergePolicy
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
