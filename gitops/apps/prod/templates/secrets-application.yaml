apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bank-of-anthos-secrets-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: {{ .Values.project }}
  source:
    repoURL: {{ required "repoURL must be set (root App helm parameter from Terraform argocd_repo_url)" .Values.repoURL | quote }}
    path: gitops/apps/prod/secrets
    targetRevision: {{ .Values.targetRevision | quote }}
    helm:
      parameters:
        - name: accountsDb.remoteKey
          value: {{ required "secrets.accountsDb.remoteKey must be set from Terraform" .Values.secrets.accountsDb.remoteKey | quote }}
        - name: ledgerDb.remoteKey
          value: {{ required "secrets.ledgerDb.remoteKey must be set from Terraform" .Values.secrets.ledgerDb.remoteKey | quote }}
  destination:
    server: {{ .Values.destinationServer | quote }}
    namespace: {{ .Values.destinationNamespace | quote }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
