apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bank-of-anthos-secrets-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: {{ .Values.project }}
  source:
    repoURL: {{ required "repoURL must be set (root App helm parameter from Terraform argocd_repo_url)" .Values.repoURL | quote }}
    path: gitops/apps/prod/secrets
    targetRevision: {{ .Values.targetRevision | quote }}
  destination:
    server: {{ .Values.destinationServer | quote }}
    namespace: {{ .Values.destinationNamespace | quote }}
  # Manual sync for prod (same policy as the app Application).
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
