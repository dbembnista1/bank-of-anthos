apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bank-of-anthos-prod
  namespace: argocd
spec:
  project: {{ .Values.project }}
  source:
    repoURL: {{ required "repoURL must be set (root App helm parameter from Terraform argocd_repo_url)" .Values.repoURL | quote }}
    path: charts/bank-of-anthos
    targetRevision: {{ .Values.targetRevision | quote }}
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        - name: global.imageRegistry
          value: {{ required "global.imageRegistry must be set from Terraform" .Values.global.imageRegistry | quote }}
        - name: database.accountsDb.host
          value: {{ required "database.accountsDb.host must be set from Terraform" .Values.database.accountsDb.host | quote }}
        - name: database.ledgerDb.host
          value: {{ required "database.ledgerDb.host must be set from Terraform" .Values.database.ledgerDb.host | quote }}
        - name: frontend.ingress.enabled
          value: {{ .Values.frontend.ingress.enabled | toString | quote }}
        - name: frontend.scheme
          value: {{ .Values.frontend.scheme | default "http" | quote }}
        - name: frontend.ingress.host
          value: {{ .Values.frontend.ingress.host | default "" | quote }}
        - name: frontend.ingress.certificateArn
          value: {{ .Values.frontend.ingress.certificateArn | default "" | quote }}
  destination:
    server: {{ .Values.destinationServer | quote }}
    namespace: {{ .Values.destinationNamespace | quote }}
  # Manual sync for prod (demo/lab: promote deliberately from the Argo CD UI/CLI).
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
