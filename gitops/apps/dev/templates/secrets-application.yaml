apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bank-of-anthos-secrets-dev
  namespace: argocd
  annotations:
    # Sync secrets before the app chart so pods can mount credentials.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: {{ .Values.project }}
  source:
    repoURL: {{ required "repoURL must be set (root App helm parameter from Terraform argocd_repo_url)" .Values.repoURL | quote }}
    path: gitops/apps/dev/secrets
    targetRevision: {{ .Values.targetRevision | quote }}
  destination:
    server: {{ .Values.destinationServer | quote }}
    namespace: {{ .Values.destinationNamespace | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
