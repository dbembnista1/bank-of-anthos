# Defaults for helm template / local render.
# Live cluster: root-dev helm.parameters from Terraform
# (repoURL, targetRevision, global.imageRegistry, database.*.host, secrets.*.remoteKey,
#  frontend.ingress.*, frontend.scheme).
repoURL: ""
targetRevision: main
project: bank-of-anthos
destinationServer: https://kubernetes.default.svc
destinationNamespace: bank-of-anthos-dev
global:
  imageRegistry: ""
database:
  accountsDb:
    host: ""
  ledgerDb:
    host: ""
secrets:
  accountsDb:
    remoteKey: ""
  ledgerDb:
    remoteKey: ""
frontend:
  scheme: http
  ingress:
    enabled: false
    host: ""
    certificateArn: ""
