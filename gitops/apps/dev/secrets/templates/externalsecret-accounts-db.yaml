apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: accounts-db-credentials
  labels:
    app.kubernetes.io/name: bank-of-anthos
    app.kubernetes.io/component: accounts-db
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.accountsDb.secretName | quote }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "{{ `{{ .username }}` }}"
        password: "{{ `{{ .password }}` }}"
        uri: "{{ `postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@{{ .host }}:{{ .port }}/{{ .dbname }}` }}"
  dataFrom:
    - extract:
        key: {{ required "accountsDb.remoteKey must be set (Terraform → Argo)" .Values.accountsDb.remoteKey | quote }}
