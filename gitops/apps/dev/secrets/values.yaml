# After terraform apply:
#   - jwt.remoteKey: terraform output -raw jwt_secret_name  (default bank-of-anthos-jwt)
#   - accountsDb/ledgerDb.remoteKey: terraform output -json rds_master_user_secret_arns
#       → .dev.accounts / .dev.ledger  (full ARN is a valid ESO remoteRef key)
clusterSecretStoreName: aws-secrets-manager
refreshInterval: 1h

jwt:
  secretName: jwt-key
  remoteKey: bank-of-anthos-jwt

accountsDb:
  secretName: accounts-db-credentials
  remoteKey: "PLACEHOLDER_DEV_ACCOUNTS_RDS_SECRET_ARN"

ledgerDb:
  secretName: ledger-db-credentials
  remoteKey: "PLACEHOLDER_DEV_LEDGER_RDS_SECRET_ARN"
