# Overrides for PROD environment (merged on top of values.yaml by ArgoCD).
# Namespace: bank-of-anthos-prod (shared EKS). Enable via terraform enabled_environments = [..., "prod"].
# HA: replicas >= 2 for stateless services.
#
# After terraform apply (with prod enabled), set database.*.host from:
#   terraform output -json rds_instance_endpoints  →  .prod.accounts / .prod.ledger

database:
  accountsDb:
    host: "PLACEHOLDER_PROD_ACCOUNTS_RDS_ENDPOINT"
  ledgerDb:
    host: "PLACEHOLDER_PROD_LEDGER_RDS_ENDPOINT"

frontend:
  replicas: 3

userservice:
  replicas: 2

contacts:
  replicas: 2

ledgerWriter:
  replicas: 2

balanceReader:
  replicas: 2

transactionHistory:
  replicas: 2

loadgenerator:
  enabled: true
  replicas: 1

dbInit:
  enabled: true
  loadDemoData: true
