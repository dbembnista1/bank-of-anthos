# Overrides for PROD environment (merged on top of values.yaml by ArgoCD).
# Namespace: bank-of-anthos-prod. Enable via terraform enabled_environments = [..., "prod"].
# HA: replicas >= 2 for stateless services.
#
# database.*.host is injected by Terraform via Argo Helm parameters (not pasted here).

frontend:
  replicas: 3

userservice:
  replicas: 2

contacts:
  replicas: 2

ledgerWriter:
  replicas: 2

balanceReader:
  replicas: 2

transactionHistory:
  replicas: 2

loadgenerator:
  enabled: true
  replicas: 1

dbInit:
  enabled: true
  loadDemoData: true
