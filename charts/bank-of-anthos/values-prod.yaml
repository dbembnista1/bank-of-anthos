# Overrides for PROD environment (merged on top of values.yaml by ArgoCD).
# Namespace: bank-of-anthos-prod. Enable via terraform enabled_environments = [..., "prod"].
# HA: replicas >= 2 for stateless services.
#
# database.*.host and global.imageRegistry are injected by Terraform via Argo Helm
# parameters (not pasted here).
#
# Image tags: promote from values-dev.yaml via cd-update-values-prod (manual).

frontend:
  replicas: 3
  image:
    tag: "2db75d6"

userservice:
  replicas: 2
  image:
    tag: "2db75d6"

contacts:
  replicas: 2
  image:
    tag: "2db75d6"

ledgerWriter:
  replicas: 2
  image:
    tag: "2db75d6"

balanceReader:
  replicas: 2
  image:
    tag: "2db75d6"

transactionHistory:
  replicas: 2
  image:
    tag: "2db75d6"

loadgenerator:
  enabled: true
  replicas: 1
  image:
    tag: "2db75d6"

dbInit:
  enabled: true
  loadDemoData: true
