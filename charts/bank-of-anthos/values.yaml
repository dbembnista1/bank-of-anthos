# Default values for bank-of-anthos umbrella chart.
# Environment overlays: values-dev.yaml / values-prod.yaml (merged by ArgoCD).
# Image tags live in env overlays (CI bumps values-dev; promote copies to values-prod).
# Passwords never live here — External Secrets Operator.

global:
  # Injected at sync by Argo from Terraform (root-* helm.parameters). Do not paste account IDs.
  imageRegistry: "SET_BY_ARGO_FROM_TERRAFORM"
  # Shared labels applied by templates
  labels:
    application: bank-of-anthos
  # Demo / routing config (ConfigMaps)
  localRoutingNum: "883745000"
  pubKeyPath: "/tmp/.ssh/publickey"
  logLevel: info
  enableTracing: "false"

# Kubernetes ServiceAccount used by app pods (no GKE Workload Identity annotation).
serviceAccount:
  name: bank-of-anthos

# Secret names expected in the namespace (created by External Secrets Operator — not by this chart).
secrets:
  jwt:
    name: jwt-key
  accountsDb:
    name: accounts-db-credentials
  ledgerDb:
    name: ledger-db-credentials

# RDS hosts — overridden at sync by Argo Helm parameters from Terraform (per env).
# Passwords stay in AWS Secrets Manager (RDS-managed); ESO syncs into the cluster.
# db names use underscores — RDS CreateDBInstance forbids hyphens.
database:
  accountsDb:
    host: "SET_BY_ARGO_FROM_TERRAFORM"
    port: 5432
    name: "accounts_db"
    username: "accounts_admin"
  ledgerDb:
    host: "SET_BY_ARGO_FROM_TERRAFORM"
    port: 5432
    name: "ledger_db"
    username: "ledger_admin"

# One-shot Jobs that apply upstream BoA SQL schema (+ optional demo data) to RDS.
# Requires DB credentials Secrets to exist. Safe to disable after first successful seed.
dbInit:
  enabled: true
  image: "postgres:16-alpine"
  # Load demo users / transactions from upstream init scripts
  loadDemoData: true
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# ---------------------------------------------------------------------------
# Application services (ECR repos match terraform ecr_repository_names)
# resources match upstream kubernetes-manifests in GoogleCloudPlatform/bank-of-anthos
# image.tag is overridden per env (values-dev.yaml / values-prod.yaml).
# ---------------------------------------------------------------------------

frontend:
  image:
    repository: bank-of-anthos/frontend
    tag: "SET_BY_ENV_OVERLAY"
  replicas: 1
  # Flask url_for(_scheme=...). Injected as https when ingress_domain is set (TLS on ALB).
  scheme: http
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  # Public ALB Ingress. enabled / host / certificateArn are injected at sync by Argo
  # from Terraform (like RDS hosts). Do not set them in values-dev.yaml / values-prod.yaml.
  # Empty host = lab (own ALB, HTTP :80). Set host = group.name + ACM + 80→443.
  ingress:
    enabled: false
    host: ""
    certificateArn: ""
    groupName: bank-of-anthos
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"

userservice:
  image:
    repository: bank-of-anthos/userservice
    tag: "SET_BY_ENV_OVERLAY"
  replicas: 1
  service:
    port: 8080
  resources:
    requests:
      cpu: "260m"
      memory: "128Mi"
      ephemeral-storage: "0.25Gi"
    limits:
      cpu: "500m"
      memory: "256Mi"
      ephemeral-storage: "0.25Gi"

