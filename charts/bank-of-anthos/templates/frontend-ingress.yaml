{{- if eq (.Values.frontend.ingress.enabled | toString) "true" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  labels:
    {{- include "bank-of-anthos.labels" . | nindent 4 }}
    app: frontend
    team: frontend
    tier: web
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /ready
    {{- if .Values.frontend.ingress.host }}
    alb.ingress.kubernetes.io/group.name: {{ .Values.frontend.ingress.groupName | quote }}
    alb.ingress.kubernetes.io/certificate-arn: {{ required "frontend.ingress.certificateArn is required when host is set" .Values.frontend.ingress.certificateArn | quote }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- end }}
spec:
  ingressClassName: alb
  rules:
{{- if .Values.frontend.ingress.host }}
    - host: {{ .Values.frontend.ingress.host | quote }}
      http:
{{- else }}
    - http:
{{- end }}
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
