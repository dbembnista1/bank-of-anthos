{{- if .Values.dbInit.enabled }}
{{- /*
Schema + demo seed for ledger RDS.
SQL adapted from GoogleCloudPlatform/bank-of-anthos ledger-db initdb.
CREATE TABLE / INDEX made idempotent (IF NOT EXISTS) for safer re-runs.
Requires Secret ledger-db-credentials (keys: username, password) from ESO.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-db-init-scripts
  labels:
    {{- include "bank-of-anthos.labels" . | nindent 4 }}
    team: ledger
    tier: db
data:
  0_init_tables.sql: |
    CREATE TABLE IF NOT EXISTS TRANSACTIONS (
      TRANSACTION_ID BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      FROM_ACCT CHAR(10) NOT NULL,
      TO_ACCT CHAR(10) NOT NULL,
      FROM_ROUTE CHAR(9) NOT NULL,
      TO_ROUTE CHAR(9) NOT NULL,
      AMOUNT INT NOT NULL,
      TIMESTAMP TIMESTAMP NOT NULL
    );
    CREATE INDEX IF NOT EXISTS transactions_from_acct_from_route_timestamp_idx
      ON TRANSACTIONS (FROM_ACCT, FROM_ROUTE, TIMESTAMP);
    CREATE INDEX IF NOT EXISTS transactions_to_acct_to_route_timestamp_idx
      ON TRANSACTIONS (TO_ACCT, TO_ROUTE, TIMESTAMP);
    DROP RULE IF EXISTS PREVENT_UPDATE ON TRANSACTIONS;
    CREATE RULE PREVENT_UPDATE AS
      ON UPDATE TO TRANSACTIONS
      DO INSTEAD NOTHING;
    DROP RULE IF EXISTS PREVENT_DELETE ON TRANSACTIONS;
    CREATE RULE PREVENT_DELETE AS
      ON DELETE TO TRANSACTIONS
      DO INSTEAD NOTHING;

  1_create_transactions.sh: |
    #!/bin/bash
    set -u
    if [ "${USE_DEMO_DATA}" != "True" ]; then
      echo "USE_DEMO_DATA not True; no demo transactions added"
      exit 0
    fi
    readonly ENV_VARS=("POSTGRES_DB" "POSTGRES_USER" "POSTGRES_PASSWORD" "LOCAL_ROUTING_NUM")
    add_transaction() {
      DATE=$(date -u +"%Y-%m-%d %H:%M:%S.%3N%z" --date="@$(($6))" 2>/dev/null || date -u -d "@$6" +"%Y-%m-%d %H:%M:%S+0000")
      echo "adding demo transaction: $1 -> $2"
      PGPASSWORD="$POSTGRES_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
        -v fromacct="$1" -v toacct="$2" -v fromroute="$3" -v toroute="$4" -v amount="$5" \
        --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        INSERT INTO TRANSACTIONS (FROM_ACCT, TO_ACCT, FROM_ROUTE, TO_ROUTE, AMOUNT, TIMESTAMP)
        VALUES (:'fromacct', :'toacct', :'fromroute', :'toroute', :'amount', '$DATE');
    EOSQL
    }
    create_transactions() {
      PAY_PERIODS=3
      DAYS_BETWEEN_PAY=14
      SECONDS_IN_PAY_PERIOD=$((86400 * DAYS_BETWEEN_PAY))
      DEPOSIT_AMOUNT=250000
      START_TIMESTAMP=$(( $(date +%s) - $(( (PAY_PERIODS + 1) * SECONDS_IN_PAY_PERIOD )) ))
      for i in $(seq 1 $PAY_PERIODS); do
        for account in "${USER_ACCOUNTS[@]}"; do
          add_transaction "$EXTERNAL_ACCOUNT" "$account" "$EXTERNAL_ROUTING" "$LOCAL_ROUTING_NUM" $DEPOSIT_AMOUNT $START_TIMESTAMP
        done
        TRANSACTIONS_PER_PERIOD=$(shuf -i 15-20 -n1)
        for p in $(seq 1 $TRANSACTIONS_PER_PERIOD); do
          AMOUNT=$(shuf -i 1000-10000 -n1)
          SENDER_ACCOUNT=${USER_ACCOUNTS[$RANDOM % ${#USER_ACCOUNTS[@]}]}
          RECIPIENT_ACCOUNT=${USER_ACCOUNTS[$RANDOM % ${#USER_ACCOUNTS[@]}]}
          if [[ "$SENDER_ACCOUNT" == "$RECIPIENT_ACCOUNT" ]]; then
            RECIPIENT_ACCOUNT=$(shuf -i 1000000000-9999999999 -n1)
          fi
          TIMESTAMP=$(( START_TIMESTAMP + (SECONDS_IN_PAY_PERIOD * p / (TRANSACTIONS_PER_PERIOD + 1)) ))
          add_transaction "$SENDER_ACCOUNT" "$RECIPIENT_ACCOUNT" "$LOCAL_ROUTING_NUM" "$LOCAL_ROUTING_NUM" $AMOUNT $TIMESTAMP
        done
        START_TIMESTAMP=$(( START_TIMESTAMP + (i * SECONDS_IN_PAY_PERIOD) ))
      done
    }
    create_ledger() {
      USER_ACCOUNTS=("1011226111" "1033623433" "1055757655" "1077441377")
      EXTERNAL_ACCOUNT="9099791699"
      EXTERNAL_ROUTING="808889588"
      create_transactions
    }
    main() {
      for env_var in "${ENV_VARS[@]}"; do
        if [[ -z "${!env_var}" ]]; then
          echo "Error: environment variable '$env_var' not set. Aborting."
          exit 1
        fi
      done
      create_ledger
    }
    main

  initialize-database.sh: |
    #!/bin/bash
    set -euo pipefail
    echo "Waiting for ledger RDS at ${PGHOST}:${PGPORT}/${POSTGRES_DB}..."
    for i in $(seq 1 30); do
      if pg_isready --host="${PGHOST}" --port="${PGPORT}" --dbname="${POSTGRES_DB}" --username="${POSTGRES_USER}"; then
        echo "Database is ready"
        break
      fi
      echo "Attempt ${i}/30: not ready, retrying in 5s..."
      sleep 5
      if [ "${i}" -eq 30 ]; then
        echo "Database did not become ready in time"
        exit 1
      fi
    done
    echo "Applying ledger schema..."
    psql -v ON_ERROR_STOP=1 --host="${PGHOST}" --port="${PGPORT}" --username="${POSTGRES_USER}" --dbname="${POSTGRES_DB}" \
      -f /scripts/0_init_tables.sql
    if [ "${USE_DEMO_DATA}" = "True" ]; then
      echo "Loading ledger demo transactions..."
      bash /scripts/1_create_transactions.sh
    else
      echo "Skipping ledger demo data (dbInit.loadDemoData=false)"
    fi
    echo "Ledger DB init complete"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: populate-ledger-db
  annotations:
    # Job pod template is immutable; replace instead of patch on sync.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
  labels:
    {{- include "bank-of-anthos.labels" . | nindent 4 }}
    app: populate-ledger-db
    team: ledger
    tier: db
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: populate-ledger-db
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "bank-of-anthos.serviceAccountName" . }}
      restartPolicy: Never
      containers:
        - name: populate-ledger-db
          image: {{ .Values.dbInit.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "bash /scripts/initialize-database.sh"]
          env:
            - name: PGHOST
              value: {{ .Values.database.ledgerDb.host | quote }}
            - name: PGPORT
              value: {{ .Values.database.ledgerDb.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.ledgerDb.name | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-of-anthos.ledgerDbSecretName" . }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-of-anthos.ledgerDbSecretName" . }}
                  key: password
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-of-anthos.ledgerDbSecretName" . }}
                  key: password
            - name: LOCAL_ROUTING_NUM
              value: {{ .Values.global.localRoutingNum | quote }}
            - name: USE_DEMO_DATA
              value: {{ if .Values.dbInit.loadDemoData }}"True"{{ else }}"False"{{ end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            {{- toYaml .Values.dbInit.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
      volumes:
        - name: scripts
          configMap:
            name: ledger-db-init-scripts
            defaultMode: 0755
{{- end }}
