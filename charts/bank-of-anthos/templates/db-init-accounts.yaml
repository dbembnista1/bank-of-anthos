{{- if .Values.dbInit.enabled }}
{{- /*
Schema + demo seed for accounts RDS.
SQL/scripts adapted from GoogleCloudPlatform/bank-of-anthos (accounts-db initdb /
extras/cloudsql/populate-jobs). Connects directly to RDS — no Cloud SQL Proxy.
Requires Secret accounts-db-credentials (keys: username, password) from ESO.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: accounts-db-init-scripts
  labels:
    {{- include "bank-of-anthos.labels" . | nindent 4 }}
    team: accounts
    tier: db
data:
  0-accounts-schema.sql: |
    CREATE TABLE IF NOT EXISTS users (
      accountid CHAR(10) PRIMARY KEY,
      username VARCHAR(64) UNIQUE NOT NULL,
      passhash BYTEA NOT NULL,
      firstname VARCHAR(64) NOT NULL,
      lastname VARCHAR(64) NOT NULL,
      birthday DATE NOT NULL,
      timezone VARCHAR(8) NOT NULL,
      address VARCHAR(64) NOT NULL,
      state CHAR(2) NOT NULL,
      zip VARCHAR(5) NOT NULL,
      ssn CHAR(11) NOT NULL
    );
    CREATE INDEX IF NOT EXISTS idx_users_accountid ON users (accountid);
    CREATE INDEX IF NOT EXISTS idx_users_username ON users (username);
    CREATE TABLE IF NOT EXISTS contacts (
      username VARCHAR(64) NOT NULL,
      label VARCHAR(128) NOT NULL,
      account_num CHAR(10) NOT NULL,
      routing_num CHAR(9) NOT NULL,
      is_external BOOLEAN NOT NULL,
      FOREIGN KEY (username) REFERENCES users(username)
    );
    CREATE INDEX IF NOT EXISTS idx_contacts_username ON contacts (username);

  1-load-testdata.sh: |
    #!/bin/bash
    set -o errexit
    if [ "$USE_DEMO_DATA" != "True" ]; then
      echo "no demo users added"
      exit 0
    fi
    readonly ENV_VARS=("POSTGRES_DB" "POSTGRES_USER" "LOCAL_ROUTING_NUM")
    add_user() {
      echo "adding user: $2"
      psql -X -v ON_ERROR_STOP=1 -v account="$1" -v username="$2" -v firstname="$3" -v passhash="$DEFAULT_PASSHASH" \
        --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        INSERT INTO users VALUES (:'account', :'username', :'passhash', :'firstname', 'User', '2000-01-01', '-5', 'Bowling Green, New York City', 'NY', '10004', '111-22-3333') ON CONFLICT DO NOTHING;
    EOSQL
    }
    add_external_account() {
      echo "user $1 adding contact: $2"
      psql -X -v ON_ERROR_STOP=1 -v username="$1" -v label="$2" -v account="$3" -v routing="$4" \
        --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        INSERT INTO contacts VALUES (:'username', :'label', :'account', :'routing', 'true');
    EOSQL
    }
    add_contact() {
      echo "user $1 adding contact: $2"
      psql -X -v ON_ERROR_STOP=1 -v username="$1" -v label="$2" -v account="$3" -v routing="$LOCAL_ROUTING_NUM" \
        --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        INSERT INTO contacts VALUES (:'username', :'label', :'account', :'routing', 'false');
    EOSQL
    }
    create_accounts() {
      add_user "1011226111" "testuser" "Test"
      add_user "1033623433" "alice" "Alice"
      add_user "1055757655" "bob" "Bob"
      add_user "1077441377" "eve" "Eve"
      add_contact "testuser" "Alice" "1033623433"
      add_contact "testuser" "Bob" "1055757655"
      add_contact "testuser" "Eve" "1077441377"
      add_contact "alice" "Testuser" "1011226111"
      add_contact "alice" "Bob" "1055757655"
      add_contact "alice" "Eve" "1077441377"
      add_contact "bob" "Testuser" "1011226111"
      add_contact "bob" "Alice" "1033623433"
      add_contact "bob" "Eve" "1077441377"
      add_contact "eve" "Testuser" "1011226111"
      add_contact "eve" "Alice" "1033623433"
      add_contact "eve" "Bob" "1055757655"
      add_external_account "testuser" "External Bank" "9099791699" "808889588"
      add_external_account "alice" "External Bank" "9099791699" "808889588"
      add_external_account "bob" "External Bank" "9099791699" "808889588"
      add_external_account "eve" "External Bank" "9099791699" "808889588"
    }
    main() {
      for env_var in "${ENV_VARS[@]}"; do
        if [[ -z "${!env_var}" ]]; then
          echo "Error: environment variable '$env_var' not set. Aborting."
          exit 1
        fi
      done
      # bcrypt hash for demo password 'bankofanthos' (upstream BoA)
      DEFAULT_PASSHASH='\x2432622431322477595638423166664b50667a41524a6b69614d6c5075784847466961636b6d333349595952786d59645a6834435946696f49434943'
      create_accounts
    }
    main

  initialize-database.sh: |
    #!/bin/bash
    set -euo pipefail
    echo "Waiting for accounts RDS at ${PGHOST}:${PGPORT}/${POSTGRES_DB}..."
    for i in $(seq 1 30); do
      if pg_isready --host="${PGHOST}" --port="${PGPORT}" --dbname="${POSTGRES_DB}" --username="${POSTGRES_USER}"; then
        echo "Database is ready"
        break
      fi
      echo "Attempt ${i}/30: not ready, retrying in 5s..."
      sleep 5
      if [ "${i}" -eq 30 ]; then
        echo "Database did not become ready in time"
        exit 1
      fi
    done
    echo "Applying accounts schema..."
    psql -v ON_ERROR_STOP=1 --host="${PGHOST}" --port="${PGPORT}" --username="${POSTGRES_USER}" --dbname="${POSTGRES_DB}" \
      -f /scripts/0-accounts-schema.sql
    if [ "${USE_DEMO_DATA}" = "True" ]; then
      echo "Loading accounts demo data..."
      bash /scripts/1-load-testdata.sh
    else
      echo "Skipping accounts demo data (dbInit.loadDemoData=false)"
    fi
    echo "Accounts DB init complete"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: populate-accounts-db
  annotations:
    # Job pod template is immutable; replace instead of patch on sync.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
  labels:
    {{- include "bank-of-anthos.labels" . | nindent 4 }}
    app: populate-accounts-db
    team: accounts
    tier: db
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: populate-accounts-db
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "bank-of-anthos.serviceAccountName" . }}
      restartPolicy: Never
      containers:
        - name: populate-accounts-db
          image: {{ .Values.dbInit.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "bash /scripts/initialize-database.sh"]
          env:
            - name: PGHOST
              value: {{ .Values.database.accountsDb.host | quote }}
            - name: PGPORT
              value: {{ .Values.database.accountsDb.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.accountsDb.name | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-of-anthos.accountsDbSecretName" . }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-of-anthos.accountsDbSecretName" . }}
                  key: password
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-of-anthos.accountsDbSecretName" . }}
                  key: password
            - name: LOCAL_ROUTING_NUM
              value: {{ .Values.global.localRoutingNum | quote }}
            - name: USE_DEMO_DATA
              value: {{ if .Values.dbInit.loadDemoData }}"True"{{ else }}"False"{{ end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            {{- toYaml .Values.dbInit.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
      volumes:
        - name: scripts
          configMap:
            name: accounts-db-init-scripts
            defaultMode: 0755
{{- end }}
