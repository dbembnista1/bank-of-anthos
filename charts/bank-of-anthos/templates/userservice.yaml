apiVersion: v1
kind: Service
metadata:
  name: userservice
  labels:
    {{- include "bank-of-anthos.labels" . | nindent 4 }}
    app: userservice
    team: accounts
    tier: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.userservice.service.port }}
      targetPort: {{ .Values.userservice.service.port }}
  selector:
    app: userservice
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  labels:
    {{- include "bank-of-anthos.labels" . | nindent 4 }}
    app: userservice
    team: accounts
    tier: backend
spec:
  replicas: {{ .Values.userservice.replicas }}
  selector:
    matchLabels:
      app: userservice
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "bank-of-anthos.labels" . | nindent 8 }}
        app: userservice
        team: accounts
        tier: backend
    spec:
      serviceAccountName: {{ include "bank-of-anthos.serviceAccountName" . }}
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 5
      containers:
        - name: userservice
          image: {{ include "bank-of-anthos.image" (dict "root" . "image" .Values.userservice.image) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-server
              containerPort: {{ .Values.userservice.service.port }}
          env:
            - name: VERSION
              value: {{ .Values.userservice.image.tag | quote }}
            - name: PORT
              value: {{ .Values.userservice.service.port | quote }}
            - name: ENABLE_TRACING
              value: {{ .Values.global.enableTracing | quote }}
            - name: TOKEN_EXPIRY_SECONDS
              value: "3600"
            - name: PRIV_KEY_PATH
              value: /tmp/.ssh/privatekey
            - name: LOG_LEVEL
              value: {{ .Values.global.logLevel | quote }}
            # Full URI with password — created by External Secrets (not in ConfigMap).
            - name: ACCOUNTS_DB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "bank-of-anthos.accountsDbSecretName" . }}
                  key: uri
          envFrom:
            - configMapRef:
                name: environment-config
            - configMapRef:
                name: accounts-db-config
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.userservice.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.userservice.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: keys
              mountPath: /tmp/.ssh
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: keys
          secret:
            secretName: {{ include "bank-of-anthos.jwtSecretName" . }}
            items:
              - key: jwtRS256.key
                path: privatekey
              - key: jwtRS256.key.pub
                path: publickey
