{{- /*
Shared ConfigMaps from upstream kubernetes-manifests/config.yaml
(GoogleCloudPlatform/bank-of-anthos). GKE Workload Identity annotations omitted.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: environment-config
  labels:
    {{- include "bank-of-anthos.labels" . | nindent 4 }}
data:
  LOCAL_ROUTING_NUM: {{ .Values.global.localRoutingNum | quote }}
  PUB_KEY_PATH: {{ .Values.global.pubKeyPath | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-api-config
  labels:
    {{- include "bank-of-anthos.labels" . | nindent 4 }}
data:
  TRANSACTIONS_API_ADDR: "ledgerwriter:8080"
  BALANCES_API_ADDR: "balancereader:8080"
  HISTORY_API_ADDR: "transactionhistory:8080"
  CONTACTS_API_ADDR: "contacts:8080"
  USERSERVICE_API_ADDR: "userservice:8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-data-config
  labels:
    {{- include "bank-of-anthos.labels" . | nindent 4 }}
data:
  USE_DEMO_DATA: "True"
  DEMO_LOGIN_USERNAME: "testuser"
  # Well-known demo UI login (upstream BoA); not an RDS credential.
  DEMO_LOGIN_PASSWORD: "bankofanthos"
