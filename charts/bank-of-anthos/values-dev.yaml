# Overrides for DEV environment (merged on top of values.yaml by ArgoCD).
# Namespace: bank-of-anthos-dev (shared EKS). Enable via terraform enabled_environments.
#
# After terraform apply, set database.*.host from:
#   terraform output -json rds_instance_endpoints  →  .dev.accounts / .dev.ledger

database:
  accountsDb:
    host: "PLACEHOLDER_DEV_ACCOUNTS_RDS_ENDPOINT"
  ledgerDb:
    host: "PLACEHOLDER_DEV_LEDGER_RDS_ENDPOINT"

frontend:
  replicas: 1

userservice:
  replicas: 1

contacts:
  replicas: 1

ledgerWriter:
  replicas: 1

balanceReader:
  replicas: 1

transactionHistory:
  replicas: 1

loadgenerator:
  enabled: true
  replicas: 1

dbInit:
  enabled: true
  loadDemoData: true
