# Overrides for DEV environment (merged on top of values.yaml by ArgoCD).
# Namespace: bank-of-anthos-dev (shared EKS). Enable via terraform enabled_environments.
#
# database.*.host is injected at sync time by Argo from Terraform
# (root-dev helm.parameters → Application parameters). Do not paste endpoints here.

frontend:
  replicas: 1

userservice:
  replicas: 1

contacts:
  replicas: 1

ledgerWriter:
  replicas: 1

balanceReader:
  replicas: 1

transactionHistory:
  replicas: 1

loadgenerator:
  enabled: true
  replicas: 1

dbInit:
  enabled: true
  loadDemoData: true
