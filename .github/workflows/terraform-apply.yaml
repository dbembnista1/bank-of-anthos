# Apply terraform/ after merge to main (and on manual dispatch).
# Disable this workflow in the Actions tab when you do not want apply to run.
# App CI does not talk to EKS; this job may (kubernetes/helm providers via aws eks get-token).
name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yaml"
  workflow_dispatch:

concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Required by var.argocd_gh_token (no default). Same PAT bootstrap stores as GH_PAT.
  TF_VAR_argocd_gh_token: ${{ secrets.GH_PAT }}

defaults:
  run:
    working-directory: terraform
    shell: bash

jobs:
  apply:
    name: plan and apply
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require GH_PAT
        run: |
          if [ -z "${TF_VAR_argocd_gh_token}" ]; then
            echo "Secret GH_PAT is empty. Bootstrap writes it (oidc.tf) for TF_VAR_argocd_gh_token."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Write backend.conf
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_DYNAMODB_TABLE: ${{ vars.TF_STATE_DYNAMODB_TABLE }}
        run: |
          cat > backend.conf <<EOF
          bucket         = "${TF_STATE_BUCKET}"
          key            = "terraform.tfstate"
          region         = "${AWS_REGION}"
          dynamodb_table = "${TF_STATE_DYNAMODB_TABLE}"
          EOF

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend-config=backend.conf -lockfile=readonly

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt

      - name: Terraform apply
        run: terraform apply -no-color -auto-approve tfplan 2>&1 | tee apply.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Terraform apply"
            echo
            if [ -f plan.txt ]; then
              echo "### Plan"
              echo
              echo '```'
              head -c 100000 plan.txt
              echo
              echo '```'
              echo
            fi
            if [ -f apply.txt ]; then
              echo "### Apply"
              echo
              echo '```'
              head -c 100000 apply.txt
              echo
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
